spring:
  application:
    name: employee-internal-transfer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_internal_transfer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-only-secret-change-this-dev-only-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health
